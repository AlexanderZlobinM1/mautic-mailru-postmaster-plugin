mailru.postmaster.config.guard_note="Пороги остановки задаются отдельно в каждой кампании: Конструктор кампании → Действие → Mail.ru Postmaster: блокировка отправки. MCC может переопределить только интервал MCD и недельное расписание."
mailru.postmaster.config.instructions="Откройте <a href='https://o2.mail.ru/login?client_id=postmaster_api_client&amp;redirect_uri=https%3A%2F%2Fpostmaster.mail.ru%2Fext-api%2Foauth%2F&amp;response_type=code&amp;state=some_state' target='_blank' rel='noopener noreferrer'>страницу получения токенов Mail.ru Postmaster</a>, войдите под владельцем доменов, скопируйте всю JSON-строку с access_token и refresh_token и вставьте её ниже. Плагин сам обновляет часовой access_token."
