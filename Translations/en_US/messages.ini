mailru.postmaster.config.guard_note="Configure thresholds in Campaign Builder: Action → Mail.ru campaign stopper unpublishes the campaign, while Condition → Mail.ru threshold check routes contacts through one of two branches. MCC may override the MCD run interval."
mailru.postmaster.config.api_window_note="The live Mail.ru API exposes only a rolling 30-day window. The plugin does not request, store, or display deeper statistics."
mailru.postmaster.config.instructions="Open the <a href='https://o2.mail.ru/login?client_id=postmaster_api_client&amp;redirect_uri=https%3A%2F%2Fpostmaster.mail.ru%2Fext-api%2Foauth%2F&amp;response_type=code&amp;state=some_state' target='_blank' rel='noopener noreferrer'>Mail.ru Postmaster token page</a>, sign in as the domain owner, copy the complete JSON line containing access_token and refresh_token, and paste it below. The plugin refreshes the one-hour access token automatically."
